[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-sim"
dynamic = ["version"]
description = "Interactive 2D gravity sandbox: create, fling and merge planets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.1.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
orbit-sim = "orbit_sim.__main__:main"

[tool.setuptools]
packages = ["orbit_sim"]

[tool.setuptools.dynamic]
version = { attr = "orbit_sim.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
